<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 – Page Not Found</title>
  <style>
    :root{
      --bg:#0b0b0f;
      --bg2:#141420;
      --ink:#f5f5f7;
      --muted:#c7c7cf;
      --accent:#e11d48;   /* red */
      --accent2:#ef4444;  /* red alt */
      --border:rgba(255,255,255,.12);
      --card:rgba(255,255,255,.06);
    }
    body{
      margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
      background: radial-gradient(1200px 600px at 30% 10%, rgba(225,29,72,.25), transparent 60%),
                  radial-gradient(900px 500px at 80% 0%, rgba(239,68,68,.18), transparent 55%),
                  linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color:var(--ink); text-align:center;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:26px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      max-width:520px;
      margin:0 16px;
    }
    h1{ margin:0 0 6px; font-size:44px; color:var(--accent); letter-spacing:.5px }
    p{ margin:0 0 18px; color:var(--muted); font-size:16px; }
    a{
      display:inline-block;
      padding:10px 14px;
      border-radius:12px;
      background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
      color:white;
      font-weight:800;
      text-decoration:none;
      border:1px solid rgba(255,255,255,.12);
    }
    a:hover{ filter:brightness(1.03); }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>Page not found.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
